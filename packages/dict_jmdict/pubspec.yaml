name: dict_jmdict
description: >-
  JMdict lookups for Shiori in pure Dart (no Flutter, no shiori_core):
  every entry spelled as a set of forms, in one call, over the SQLite file
  built by tools/dict/build_jmdict_db.py.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  # Same constraint as packages/storage_drift. Below 3.6: sqlite3 3.6+ needs
  # hooks 2.2 → meta 1.19, and Flutter 3.41 pins meta 1.17.
  sqlite3: ">=3.4.0 <3.6.0"

dev_dependencies:
  coverage: ^1.15.0
  lints: ^6.0.0
  test: ^1.30.0
