include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Written by `drift_dev schema generate` (see docs/verification.md).
    - test/migrations/generated/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_final_fields
    - avoid_dynamic_calls
    - unawaited_futures
    - prefer_const_constructors
    - sort_constructors_first
