name: shiori_storage_drift
description: >-
  SQLite storage blocks for Shiori in pure Dart (drift): textbooks, days and
  words in content tables, review cards and the press log in learning-state
  tables. Implements the repository ports of shiori_core.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  drift: ^2.35.3
  shiori_core:
    path: ../core
  # Same constraint as packages/dict_jmdict, so the app resolves one SQLite.
  # Below 3.6: sqlite3 3.6+ needs hooks 2.2 → meta 1.19, and Flutter 3.41
  # pins meta 1.17. Lift the bound when the Flutter SDK moves on.
  sqlite3: ">=3.4.0 <3.6.0"

dev_dependencies:
  build_runner: ^2.17.1
  coverage: ^1.15.0
  drift_dev: ^2.35.2
  lints: ^6.0.0
  test: ^1.30.0
