name: jmdict_block
description: >-
  The JMdict dictionary block for Shiori: adapts dict_jmdict to the core
  Lexicon port. Pure Dart, so the word extractor can be tested and scored
  with the dictionary without Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  dict_jmdict:
    path: ../dict_jmdict
  shiori_core:
    path: ../core

dev_dependencies:
  # The local test of the filled examples reads the example sentences.
  example_block:
    path: ../example_block
  # The local test of the routed capture uses the Korean glossary too.
  krdict_block:
    path: ../krdict_block
  lints: ^6.0.0
  # The local test of the built-in decks asks for accents like a card does.
  voicevox_block:
    path: ../voicevox_block
  # Same constraint as dict_jmdict: tests load the SQL fixture in memory.
  sqlite3: ">=3.4.0 <3.6.0"
  test: ^1.30.0
