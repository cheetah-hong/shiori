name: shiori_core
description: >-
  Pure Dart core of Shiori: models, ports (block slots), the word extractor
  that turns OCR lines into review entries, and the study (SRS) logic.
  No Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  unorm_dart: ^0.3.3

dev_dependencies:
  coverage: any
  lints: any
  test: any
