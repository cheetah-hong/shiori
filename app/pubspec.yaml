name: shiori
description: "시오리: 교재 사진으로 만드는 일본어 단어장"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # SF Symbols-like icons (MIT), the one icon set of the screens.
  cupertino_icons: 1.0.8
  flutter_riverpod: ^3.3.2
  image_picker: ^1.2.4
  shiori_core:
    path: ../packages/core
  # Storage: SQLite (drift) in the app support folder (path_provider).
  path_provider: ^2.1.6
  shiori_storage_drift:
    path: ../packages/storage_drift
  # Dictionary: JMdict (SQLite), unpacked from assets/dict/ on first run.
  jmdict_block:
    path: ../packages/jmdict_block
  # Korean meanings: the Basic Korean Dictionary (SQLite), unpacked from
  # assets/dict/ on first run.
  krdict_block:
    path: ../packages/krdict_block
  # Example sentences for words whose page printed none: Tatoeba (SQLite),
  # unpacked from assets/dict/ on first run.
  example_block:
    path: ../packages/example_block
  flutter_localizations:
    sdk: flutter
  # Checks the unpacked dictionary files against their edition files (sha256).
  crypto: ^3.0.6
  # "판독 기록 내보내기" (builds that are not release builds): the share sheet.
  share_plus: 13.3.1
  # Pronunciation: accent data, VOICEVOX input and the sound cache (pure Dart).
  voicevox_block:
    path: ../packages/voicevox_block
  # Pronunciation: the VOICEVOX core C API through dart:ffi.
  ffi: ^2.1.4
  # 설정 › 백업에서 복원: the system file picker (Files app on iOS).
  file_selector: 1.1.0
  # The app version written into a backup file and shown before a restore.
  package_info_plus: 10.2.2
  # 복습 알림: reminders scheduled on the device (no server, no push). 22.x is
  # the last line for this Flutter; 23.x needs Flutter 3.44.
  flutter_local_notifications: 22.3.3
  # The reminder's instant as the plugin takes it (UTC only; no zone data).
  timezone: 0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  # Tests load the JMdict test fixture into an in-memory database, and write
  # database files of older schemas.
  sqlite3: ">=3.4.0 <3.6.0"
  # Tests open the app's database file on the test isolate (NativeDatabase).
  drift: ^2.35.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Two flavors (docs/architecture.md, 5): `dev` for development (sample pages,
  # never a release) and `prod` for distribution. Commands without --flavor use dev.
  default-flavor: dev

  assets:
    # dev flavor only: OCR passes of synthetic sample pages (tools/synthetic/make_pages.py).
    - path: assets/dev_samples/
      flavors:
        - dev
    # JMdict (full-lean) and the Korean glossary as gzip plus their edition
    # files, built by tools/dict/build_app_asset.py and build_ko_glossary.py;
    # not in git. Without them the app runs with no dictionary, and release
    # builds stop (android/app/build.gradle.kts, the iOS build phase).
    - assets/dict/
    # Pronunciation: the VOICEVOX voice model and the Open JTalk dictionary
    # (gzip each, with their edition file) and the Kanjium accent table,
    # built by tools/voice/; not in git. Without them the card's speaker
    # buttons say the data is missing, and release builds stop.
    - assets/voice/
    - assets/accent/
    # The built-in deck lists (tools/decks/build_decks.py; built, not committed).
    - assets/decks/
    # The font's licence, shown on the licences page (lib/app/fonts.dart).
    - assets/fonts/OFL.txt

  # Pretendard JP 1.3.9 (SIL OFL 1.1), static weights 400, 600 and 700: the
  # one typeface for Korean and Japanese (lib/app/fonts.dart).
  fonts:
    - family: PretendardJP
      fonts:
        - asset: assets/fonts/PretendardJP-Regular.otf
          weight: 400
        - asset: assets/fonts/PretendardJP-SemiBold.otf
          weight: 600
        - asset: assets/fonts/PretendardJP-Bold.otf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
