			shellScript = "# Release builds (docs/architecture.md, 5): the dev flavor never ships, and a release carries the dictionary.\ncase \"${CONFIGURATION}\" in\n  Release-dev)\n    echo \"error: The dev flavor bundles development samples (assets/dev_samples/) and never builds for release. Build with --flavor prod.\"\n    exit 1\n    ;;\n  Release*)\n    for f in jmdict-full-lean.sqlite.gz jmdict-full-lean.edition.json; do\n      if [ ! -s \"${SRCROOT}/../assets/dict/$f\" ]; then\n        echo \"error: assets/dict/$f is missing. Build it with: python3 tools/dict/build_app_asset.py\"\n        exit 1\n      fi\n    done\n    for f in ko-glossary.sqlite.gz ko-glossary.edition.json; do\n      if [ ! -s \"${SRCROOT}/../assets/dict/$f\" ]; then\n        echo \"error: assets/dict/$f is missing. Build it with: python3 tools/dict/build_ko_glossary.py --source <krdict JSON zip>\"\n        exit 1\n      fi\n    done\n    # The assets must match their editions and JMdict must be recent: tools/dict/asset_check.py --release.\n    if ! command -v python3 >/dev/null 2>&1; then\n      echo \"error: python3 is not on PATH; the release dictionary check (tools/dict/asset_check.py) needs it. Install the Xcode command line tools.\"\n      exit 1\n    fi\n    # flutter build shows only the error: lines of a failed step, so every problem and fix line gets one.\n    if ! out=$(python3 \"${SRCROOT}/../../tools/dict/asset_check.py\" --release --engine ios --dir \"${SRCROOT}/../assets/dict\" --decks-dir \"${SRCROOT}/../assets/decks\" 2>&1); then\n      printf '%s\\n' \"$out\" | sed -e '/: ok$/d' -e 's/^ *\\(error: \\)*/error: /'\n      exit 1\n    fi\n    printf '%s\\n' \"$out\"\n    ;;\nesac\n";
		};
